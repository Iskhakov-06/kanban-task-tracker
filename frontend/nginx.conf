server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── compression ──
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript image/svg+xml application/xml;

    # ── security headers ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server_tokens off;

    # ── API → backend container ──
    # Docker's embedded DNS + a variable makes nginx re-resolve "backend",
    # so it survives backend container restarts (new IP) and starts even
    # if the backend isn't up yet.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:5000;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── hashed Vite assets: cache for a year ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ── SPA fallback; never cache index.html so deploys show up immediately ──
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
